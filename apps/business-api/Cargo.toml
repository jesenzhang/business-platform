[package]
name = "business-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "business-api"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
tokio-util = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
runtime-config = { workspace = true }
runtime-migration = { workspace = true }

shared-kernel = { workspace = true }
observability = { workspace = true }
document = { workspace = true }
document-postgres = { workspace = true }
document-sqlite = { workspace = true }
document-processing = { path = "../../crates/document-processing" }
document-processing-contracts = { path = "../../crates/document-processing-contracts" }
document-processing-postgres = { path = "../../crates/document-processing-postgres" }
document-processing-sqlite = { path = "../../crates/document-processing-sqlite" }
audit = { workspace = true }
audit-postgres = { workspace = true }
audit-sqlite = { workspace = true }
data-integrity = { workspace = true }
data-repair = { workspace = true }
runtime-governance = { workspace = true }
runtime-governance-postgres = { workspace = true }
runtime-governance-sqlite = { workspace = true }
object-storage = { workspace = true }
public-api-contracts = { workspace = true }
identity = { workspace = true }
organization = { workspace = true }
policy = { workspace = true }
identity-postgres = { workspace = true }
identity-sqlite = { workspace = true }
organization-postgres = { workspace = true }
organization-sqlite = { workspace = true }
policy-postgres = { workspace = true }
policy-sqlite = { workspace = true }

[dev-dependencies]
identity = { workspace = true, features = ["testing"] }
organization = { workspace = true, features = ["testing"] }
policy = { workspace = true, features = ["testing"] }
identity-authorization-contracts = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
tokio-util = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
base64 = { workspace = true }

[lints]
workspace = true
