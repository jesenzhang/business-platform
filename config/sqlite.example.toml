# Explicit local-only SQLite profile. Apply migrations before starting the API:
# MIGRATION__DATABASE__URL=sqlite://data/business-platform.db \
#   cargo run -p migration -- --backend sqlite up

env = "development"

[database]
backend = "sqlite"
url = "sqlite://data/business-platform.db"
max_connections = 1
min_connections = 0
acquire_timeout_secs = 10
