env = "development"

[server]
host = "0.0.0.0"
port = 3000
request_timeout_secs = 30
# Development default: allow any origin. Production overrides to an empty list.
cors_origins = ["*"]
# 10 MiB request body limit.
body_limit_bytes = 10485760

[database]
backend = "postgres"
url = "postgres://postgres:postgres@localhost:5432/enterprise_platform"
max_connections = 20
min_connections = 2
acquire_timeout_secs = 10

[storage]
endpoint = "http://localhost:9000"
access_key = "minioadmin"
secret_key = "minioadmin"
region = "us-east-1"

[storage.buckets]
documents = "enterprise-documents"
temp = "enterprise-temp"
exports = "enterprise-exports"
backups = "enterprise-backups"

[messaging]
nats_url = "nats://localhost:4222"
enabled = false

[observability]
service_name = "business-api"
log_level = "info"

[auth]
issuer_url = "http://localhost:8080/realms/enterprise"
# Development only: accept a static bearer token. Must be disabled in production.
dev_auth_enabled = true
dev_secret = "dev-only-secret"
