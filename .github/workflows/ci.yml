name: CI

on:
  push:
    branches:
      - main
      - "feat/PLAN-*"
      - "codex/plan-0008-*"
      - "codex/plan-0012-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN: "1.94.1"

jobs:
  fmt:
    name: Format (Rust 1.94.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - run: rustc --version --verbose
      - run: cargo --version
      - run: cargo fmt --all -- --check

  check:
    name: Check (Rust 1.94.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version --verbose
      - run: cargo --version
      - run: cargo check --workspace --all-targets --all-features

  clippy:
    name: Clippy (Rust 1.94.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version --verbose
      - run: cargo --version
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  architecture:
    name: Architecture Fitness
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          ./scripts/check-architecture.ps1
          ./scripts/check-openapi.ps1

  security:
    name: Security scanning (cargo-audit, gitleaks, trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cargo-audit (RustSec advisories)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
      - name: gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy (filesystem vulnerability scan)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "true"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/business-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/business-console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend-e2e:
    name: Frontend Playwright smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/business-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/business-console/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  external-access-contracts:
    name: CLI and MCP contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p business-cli --all-targets
      - run: cargo test -p agent-adapter --all-targets
      - run: cargo test -p business-api-client --all-targets
      - run: |
          python -c "import json; json.load(open('openapi.json', encoding='utf-8')); print('OpenAPI JSON: PASS')"

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  integration:
    name: PostgreSQL + MinIO + E2E contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: business_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      minio:
        image: minio/minio:RELEASE.2024-06-13T22-53-53Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        command: server /data
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/business_platform
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version --verbose
      - run: cargo --version
      - name: Create private MinIO test bucket
        run: |
          docker run --network host --rm --entrypoint /bin/sh minio/mc:RELEASE.2024-06-12T14-34-03Z -c "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/contract-test-bucket && mc anonymous set none local/contract-test-bucket"
      - name: Apply migrations
        run: cargo run -p migration -- --backend postgres up
      - name: Run real infrastructure and E2E tests
        run: |
          cargo test -p document-sqlite --all-features
          cargo test -p document-processing --all-features
          cargo test -p document-processing-sqlite --all-features --tests
          cargo test -p document-processing-postgres --test contracts --all-features -- --include-ignored --test-threads=1
          cargo test -p document-persistence-contracts --all-features
          cargo test -p document-postgres --test query_contracts --all-features -- --include-ignored --test-threads=1
          cargo test -p runtime-migration --all-features
          cargo test -p audit --all-features
          cargo test -p data-integrity --all-features
          cargo test -p data-repair --all-features
          cargo test -p runtime-governance --all-features
          cargo test -p governance-worker --all-features --test repair_worker
          cargo test -p governance-worker --all-features --test sqlite_governance
          cargo test -p governance-worker --all-features --test postgres_governance -- --include-ignored --test-threads=1
          cargo test -p migration --test migration_test --all-features -- --include-ignored --test-threads=1
          cargo test -p messaging --test outbox_reliability --all-features -- --include-ignored --test-threads=1
          cargo test -p messaging --test inbox_idempotency --all-features -- --include-ignored --test-threads=1
          cargo test -p object-storage --lib --all-features
          cargo test -p object-storage --test minio_contract --all-features -- --include-ignored --test-threads=1
          cargo test -p business-api --test documents_postgres --all-features -- --include-ignored --test-threads=1
          cargo test -p business-api --test plan_0008_postgres_minio --all-features -- --include-ignored --test-threads=1
          cargo test -p ai-worker --all-features
          cargo test -p business-worker --all-features
          cargo test -p business-worker --test postgres_minio_processing --all-features -- --include-ignored --test-threads=1
          bash scripts/test-postgres-minio-multiprocess.sh
      - name: Backup/restore drill selftest (path guards, cleanup ownership)
        run: DRILL_SELFTEST=1 bash deploy/operations/drill-backup-restore.sh
      - name: Install MinIO client
        run: |
          curl -fsSL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          mc --version
      - name: Backup/restore drill (PostgreSQL + MinIO, unique drill-owned targets)
        env:
          MC_ALIAS_HOST: http://127.0.0.1:9000
          MC_ROOT_USER: minioadmin
          MC_ROOT_PASSWORD: minioadmin
          BUCKET: business-platform
        run: bash deploy/operations/drill-backup-restore.sh
      - name: Architecture and diff checks
        shell: pwsh
        run: |
          ./scripts/check-architecture.ps1
          git diff --check
