services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-business_platform}
    ports:
      - "5432:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - demo_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-06-13T21-20-15Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/enterprise-documents
        mc anonymous set none local/enterprise-documents

  migration:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.rust-app
    environment:
      MIGRATION__DATABASE__URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-business_platform}
    command: ["/app/migration", "--backend", "postgres", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  business-api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.rust-app
    environment:
      BUSINESS_API__ENV: development
      BUSINESS_API__SERVER__HOST: 0.0.0.0
      BUSINESS_API__SERVER__PORT: "3000"
      BUSINESS_API__SERVER__CORS_ORIGINS: http://localhost:4173
      BUSINESS_API__SERVER__BODY_LIMIT_BYTES: "10485760"
      BUSINESS_API__DATABASE__BACKEND: postgres
      BUSINESS_API__DATABASE__URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-business_platform}
      BUSINESS_API__DATABASE__MAX_CONNECTIONS: "20"
      BUSINESS_API__DATABASE__MIN_CONNECTIONS: "2"
      BUSINESS_API__STORAGE__BACKEND: s3
      BUSINESS_API__STORAGE__ENDPOINT: http://minio:9000
      BUSINESS_API__STORAGE__ACCESS_KEY: minioadmin
      BUSINESS_API__STORAGE__SECRET_KEY: minioadmin
      BUSINESS_API__STORAGE__REGION: us-east-1
      BUSINESS_API__STORAGE__BUCKET: enterprise-documents
      BUSINESS_API__AUTH__DEV_AUTH_ENABLED: "true"
      BUSINESS_API__AUTH__DEV_SECRET: ${BUSINESS_API_DEV_TOKEN:-dev-only-secret}
      BUSINESS_API__AUTH__DEV_TENANT_ID: ${DEMO_TENANT_ID:-aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa}
      BUSINESS_API__AUTH__DEV_USER_ID: ${DEMO_USER_ID:-11111111-1111-1111-1111-111111111111}
      BUSINESS_API__AUTH__DEV_SUBJECT: demo-user
      BUSINESS_API__AUTH__DEV_ROLES: demo-admin
      BUSINESS_API__AUTH__DEV_PERMISSIONS: audit.read,integrity.read,integrity.scan,repair.dry-run,repair.execute,repair.approve,repair.cancel
    ports:
      - "3000:3000"
    command: ["/app/business-api"]
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  business-worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.rust-app
    environment:
      BUSINESS_WORKER__ENV: development
      BUSINESS_WORKER__DATABASE__BACKEND: postgres
      BUSINESS_WORKER__DATABASE__URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-business_platform}
      BUSINESS_WORKER__STORAGE__BACKEND: s3
      BUSINESS_WORKER__STORAGE__ENDPOINT: http://minio:9000
      BUSINESS_WORKER__STORAGE__BUCKET: enterprise-documents
      BUSINESS_WORKER__STORAGE__ACCESS_KEY: minioadmin
      BUSINESS_WORKER__STORAGE__SECRET_KEY: minioadmin
      BUSINESS_WORKER__STORAGE__REGION: us-east-1
      BUSINESS_WORKER__AI_MODE: separate
      BUSINESS_WORKER__WORKER_ID: demo-business-worker
    command: ["/app/business-worker"]
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  ai-worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.rust-app
    environment:
      AI_WORKER__ENV: development
      AI_WORKER__DATABASE__BACKEND: postgres
      AI_WORKER__DATABASE__URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-business_platform}
      AI_WORKER__STORAGE__BACKEND: s3
      AI_WORKER__STORAGE__ENDPOINT: http://minio:9000
      AI_WORKER__STORAGE__BUCKET: enterprise-documents
      AI_WORKER__STORAGE__ACCESS_KEY: minioadmin
      AI_WORKER__STORAGE__SECRET_KEY: minioadmin
      AI_WORKER__STORAGE__REGION: us-east-1
      AI_WORKER__WORKER_ID: demo-ai-worker
    command: ["/app/ai-worker"]
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  agent-adapter:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.rust-app
    environment:
      AGENT_ADAPTER__ENV: development
      AGENT_ADAPTER__SERVER__HOST: 0.0.0.0
      AGENT_ADAPTER__SERVER__PORT: "3100"
      AGENT_ADAPTER__BUSINESS_API__BASE_URL: http://business-api:3000
      AGENT_ADAPTER__BUSINESS_API__BEARER_TOKEN: ${BUSINESS_API_DEV_TOKEN:-dev-only-secret}
      AGENT_ADAPTER__AUTH__BEARER_TOKEN: ${MCP_DEV_TOKEN:-mcp-demo-token}
    ports:
      - "3100:3100"
    command: ["/app/agent-adapter"]
    depends_on:
      business-api:
        condition: service_started

  business-console:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_BUSINESS_API_BASE_URL: http://localhost:3000
        VITE_BUSINESS_API_TOKEN: ${BUSINESS_API_DEV_TOKEN:-dev-only-secret}
    ports:
      - "4173:4173"
    depends_on:
      business-api:
        condition: service_started

volumes:
  demo_postgres_data:
  demo_minio_data:
