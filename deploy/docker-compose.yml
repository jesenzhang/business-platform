version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: bp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: bp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: bp-nats
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   container_name: bp-otel-collector
  #   command: ["--config=/etc/otelcol/config.yaml"]
  #   volumes:
  #     - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
  #   ports:
  #     - "4317:4317"   # OTLP gRPC
  #     - "4318:4318"   # OTLP HTTP
  #     - "8888:8888"   # Prometheus metrics
  #     - "8889:8889"   # Prometheus exporter

  business-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bp-business-api
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/enterprise_platform
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      NATS_URL: nats://nats:4222
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  nats_data:
