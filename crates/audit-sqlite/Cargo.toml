[package]
name = "audit-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.architecture]
context = "audit"
bounded_context = "audit"
layer = "infrastructure-adapter"
role = "infrastructure-adapter"
data_owner = "audit"

[dependencies]
async-trait = { workspace = true }
audit = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Test-only: the shared `audit_events` schema is bootstrapped by the document
# SQLite migration catalog, so the chain regression tests run against real
# migrations instead of a hand-copied `CREATE TABLE`. Dev-dependency only, the
# reverse edge (`document-sqlite` dev-depends on `audit-sqlite`) means no
# production dependency cycle is introduced.
document-sqlite = { path = "../document-sqlite" }
tokio = { workspace = true }

[lints]
workspace = true
