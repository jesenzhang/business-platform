[package]
name = "object-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
bytes = "1"
# Drop the SDK's default "rustls" feature: it selects aws-smithy-runtime's
# legacy hyper-0.14 TLS connector (hyper 0.14 / hyper-rustls 0.24 / rustls
# 0.21 / rustls-webpki 0.101 / h2 0.3, several with open advisories).
# "default-https-client" alone provides the modern hyper-1.x rustls client;
# everything else matches the SDK defaults exactly.
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-types = "1"
shared-kernel = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
reqwest = { workspace = true }
# The real-provider contract lane (tests/s3_contract_lane.rs) needs raw SDK
# calls for bucket bootstrap, cleanup and capability discovery, which the
# provider-neutral port deliberately does not expose.
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-types = "1"
# tests/sdk_log_hygiene.rs drives a real S3 SDK operation through the
# production observability initialisation, so the provider safety boundary is
# verified on the crate that actually emits the material.
observability = { workspace = true }
# Only for the unit tests' no-network transport (see
# `src/client.rs` `tests::offline_client`): implementing `HttpClient` needs the
# trait, and it is the same crate version the SDK already compiles against.
# Test-only — no production target depends on it.
aws-smithy-runtime-api = "1"
# tests/sdk_log_hygiene.rs needs a raw fmt subscriber for its negative control.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
